<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kaimark</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="app-header">
        <div class="brand"><span class="brand-mark">⌑</span><strong>Kaimark</strong></div>
        <button id="help-button" class="icon-button" type="button" aria-label="사용 방법">?</button>
      </header>

      <section id="help" class="help" hidden>
        <strong>저장한 북마크를 분류하고 관리하세요</strong>
        <span>새로 저장한 북마크는 ‘분류하지 않음’에 모입니다. 제목, 메모, 폴더를 채워 나중에 쉽게 찾으세요.</span>
      </section>

      <section id="list-view">
        <div class="section-heading">
          <div><h1 id="view-title">분류하지 않음</h1><p id="view-description">새 북마크를 먼저 분류합니다.</p></div>
          <button id="refresh-button" class="text-button" type="button">새로고침</button>
        </div>
        <div class="view-tabs" role="tablist" aria-label="북마크 목록">
          <button class="view-tab active" type="button" role="tab" aria-selected="true" data-view="inbox">분류하지 않음 <span id="inbox-count">0</span></button>
          <button class="view-tab" type="button" role="tab" aria-selected="false" data-view="recent">최근 저장</button>
        </div>
        <label class="search"><span>⌕</span><input id="search-input" type="search" placeholder="내 제목, 메모, 원본 제목 검색" autocomplete="off" /></label>
        <div id="status" class="status">북마크를 불러오는 중…</div>
        <ul id="bookmark-list" class="bookmark-list" aria-live="polite"></ul>
      </section>

      <section id="editor-view" hidden>
        <button id="back-button" class="back-button" type="button">‹ 목록</button>
        <div class="editor-heading"><h1>나중에 편집</h1><p id="original-title"></p></div>
        <form id="editor-form">
          <label>1. 내 제목<input id="title-input" required maxlength="120" /></label>
          <label>2. 저장 이유 / 메모<textarea id="note-input" rows="4" maxlength="1000" placeholder="왜 저장했는지, 언제 다시 쓸지"></textarea></label>
          <label>3. 폴더 이동<select id="folder-select"></select></label>
          <button id="create-folder" class="folder-create" type="button">+ 새 폴더 만들기</button>
          <div class="editor-actions">
            <button class="primary" type="submit">변경사항 저장</button>
            <button id="open-current" type="button">현재 탭</button>
            <button id="open-new" type="button">새 탭 ↗</button>
          </div>
        </form>
      </section>
      <div id="toast" class="toast" role="status" hidden></div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
