<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kaimark</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="app-header">
        <div class="brand"><img class="brand-mark" src="icons/icon48.png" alt="" /><strong>Kaimark</strong></div>
        <div class="header-actions">
          <button id="help-button" class="icon-button" type="button" data-i18n-aria-label="helpLabel" aria-label="How to use">?</button>
          <button id="settings-button" class="icon-button" type="button" data-i18n-aria-label="settings" aria-label="Settings">⚙</button>
        </div>
      </header>

      <section id="help" class="help" hidden>
        <strong data-i18n="helpTitle">Organize and rediscover your bookmarks</strong>
        <span data-i18n="helpDescription">Add a title and note to recent bookmarks, and organize them in folders so you can find them later.</span>
      </section>

      <section id="list-view">
        <div class="section-heading">
          <div><h1 data-i18n="recent">Recent</h1><p data-i18n="recentDescription">Recently saved bookmarks</p></div>
          <div class="list-actions">
            <button id="bookmark-manager-button" class="text-button" type="button" data-i18n="bookmarkManager">Bookmark Manager</button>
            <button id="refresh-button" class="text-button" type="button" data-i18n="refresh">Refresh</button>
          </div>
        </div>
        <label class="search"><span>⌕</span><input id="search-input" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="Search titles, notes, and bookmarks" autocomplete="off" /></label>
        <div id="status" class="status">Loading bookmarks…</div>
        <ul id="bookmark-list" class="bookmark-list" aria-live="polite"></ul>
      </section>

      <section id="editor-view" hidden>
        <button id="back-button" class="back-button" type="button"><span aria-hidden="true">←</span><span data-i18n="backToList">Back to list</span></button>
        <div class="editor-heading"><h1 data-i18n="editBookmark">Edit bookmark</h1><p id="original-title"></p></div>
        <form id="editor-form">
          <label><span data-i18n="personalTitle">1. My title</span><input id="title-input" required maxlength="120" /></label>
          <label><span data-i18n="noteLabel">2. Why I saved it / note</span><textarea id="note-input" rows="4" maxlength="1000" data-i18n-placeholder="notePlaceholder" placeholder="Why you saved this or when to use it"></textarea></label>
          <label><span data-i18n="moveFolder">3. Move to folder</span><select id="folder-select"></select></label>
          <button id="create-folder" class="folder-create" type="button" data-i18n="createFolder">+ Create folder</button>
          <div class="editor-actions">
            <button class="primary" type="submit" data-i18n="saveChanges">Save changes</button>
            <button id="open-current" type="button" data-i18n="openCurrent">Current tab</button>
            <button id="open-new" type="button" data-i18n="openNew">New tab ↗</button>
          </div>
        </form>
      </section>

      <section id="settings-view" hidden>
        <button id="settings-back-button" class="back-button" type="button"><span aria-hidden="true">←</span><span data-i18n="backToList">Back to list</span></button>
        <div class="editor-heading"><h1 data-i18n="settings">Settings</h1></div>
        <div class="settings-section">
          <h2 data-i18n="appearance">Appearance</h2>
          <div class="theme-toggle" role="group" data-i18n-aria-label="appearance" aria-label="Appearance">
            <button type="button" data-theme="system" aria-pressed="true" data-i18n="system">System</button>
            <button type="button" data-theme="light" aria-pressed="false" data-i18n="light">Light</button>
            <button type="button" data-theme="dark" aria-pressed="false" data-i18n="dark">Dark</button>
          </div>
        </div>
        <div class="settings-section">
          <h2 data-i18n="language">Language</h2>
          <div class="theme-toggle" role="group" data-i18n-aria-label="language" aria-label="Language">
            <button type="button" data-language="system" aria-pressed="true" data-i18n="system">System</button>
            <button type="button" data-language="en" aria-pressed="false">English</button>
            <button type="button" data-language="ko" aria-pressed="false">한국어</button>
          </div>
        </div>
        <div class="settings-section settings-links">
          <a id="report-bug-link" href="https://github.com/straycat405/kaimark/issues/new" target="_blank" rel="noreferrer"><span data-i18n="reportBug">Report a Bug</span><span aria-hidden="true">↗</span></a>
          <a id="changelog-link" href="https://github.com/straycat405/kaimark/commits/main" target="_blank" rel="noreferrer"><span data-i18n="changelog">Changelog</span><span aria-hidden="true">↗</span></a>
        </div>
      </section>
      <div id="toast" class="toast" role="status" hidden></div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
